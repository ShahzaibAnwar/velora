<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Velora</title>
  <defs>
    <linearGradient id="tile" x1="96" y1="96" x2="928" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28D7E5"/>
      <stop offset="0.55" stop-color="#5BA4F2"/>
      <stop offset="1" stop-color="#8C75FF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1020" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#gloss)"/>
  <g filter="url(#soft)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- The V doubles as a downward arrow -->
    <path d="M300 286 L512 664 L724 286" stroke-width="112"/>
    <!-- Landing line -->
    <path d="M392 790 H632" stroke-width="76" stroke-opacity="0.9"/>
  </g>
</svg>
