name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't paste private download links** (signed URLs, tokens).
        Security problems go to the private advisory form described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a download from …
        2. Pause after …
        3. …
  - type: input
    id: version
    attributes:
      label: Velora version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Download engine, Interface, Browser extension, Installer, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings → Privacy & security → Log folder. Logs contain URLs without query strings; check before posting.
      render: text
