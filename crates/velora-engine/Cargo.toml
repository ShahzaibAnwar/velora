[package]
name = "velora-engine"
description = "Download engine for Velora Download Manager: segmented HTTP(S) downloads, resume, queue and scheduling"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
reqwest.workspace = true
futures-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
url = "2"
percent-encoding = "2"
httpdate = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# BitTorrent (magnet links and .torrent files).
# `rust-tls` hashes pieces with ring instead of the unmaintained crypto-hash crate.
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
# Unpacking the ffmpeg build fetched on first use.
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1.40", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
