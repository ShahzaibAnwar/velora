[workspace]
resolver = "2"
members = ["crates/velora-engine", "src-tauri"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "MIT"
authors = ["Velora contributors"]
repository = "https://github.com/ShahzaibAnwar/velora"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "socks"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
